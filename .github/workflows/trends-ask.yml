name: Ask on Telegram about a new trends list

on:
  pull_request:
    types: [opened, reopened]
    paths: [trends.json]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to ask about
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ask:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'trends/') || startsWith(github.head_ref, 'claude/trends')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT: ${{ vars.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Send the list with Publish and Skip buttons
        run: .github/scripts/ask.sh "${{ github.event.pull_request.number || inputs.pr }}"
